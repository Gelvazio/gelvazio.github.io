<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c24"/>
      <stop offset="100%" stop-color="#1e1050"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Left bracket < -->
  <polyline points="10,8 4,16 10,24"
    fill="none" stroke="#c084fc" stroke-width="2.6"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Slash / -->
  <line x1="18" y1="7" x2="13" y2="25"
    stroke="#818cf8" stroke-width="2.2"
    stroke-linecap="round"/>
  <!-- Right bracket > -->
  <polyline points="21,8 27,16 21,24"
    fill="none" stroke="#c084fc" stroke-width="2.6"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
